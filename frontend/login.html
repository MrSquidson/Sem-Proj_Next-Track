<!doctype html>
<!-- 
  Kopieret fra index.html
-->
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Track - Login</title>

    <!-- Forbindelse til vores CSS-ark (styles.css), som bestemmer hvordan det ser ud -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <!-- Logo og navn i venstre side -->
      <div class="logo-container">
        <!-- Billedet af logoet. Vi bruger 'border-radius: 50%' i CSS til at fjerne den hvide baggrund -->
        <img src="image/nextlogo.jpg" alt="Next Track Logo" class="logo-img" />
        <span class="logo-text">Next Track</span>
      </div>

      <!-- Navigation (Menupunkter) i højre side -->
      <nav class="navbar">
        <a href="/">Home</a>
        <a href="/queue">Queue</a>
        <a href="/login.html" class="active">Login</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>

    <div class="main-content">
        <form action="../backend/users.js">
            <!-- For input types see; https://www.w3schools.com/html/html_form_input_types.asp 
                Password is chosen as the type here because this type of field is usually 
                protected by the client. (Also inputs are masked!)-->
            <input id="Username" class="loginInputs" type="text" placeholder="Username"/>
            <input id="Password" class="loginInputs" type="password" placeholder="Password"/>
            <input class="loginInputs" type="submit" value="Login!"/>
        </form>
    </div>

  </body>
</html>
