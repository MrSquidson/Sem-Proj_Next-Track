<!DOCTYPE html>
<!-- 
  EKSAMENSFORKLARING: 
  <!DOCTYPE html> fortæller browseren, at det er et moderne HTML5-dokument.
  'lang="da"' fortæller at sproget er dansk (godt for tilgængelighed).
-->
<html lang="da">
<head>
    <!-- Tekniske indstillinger: Gør at vi kan bruge æ, ø, å og gør siden mobilvenlig -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Track - Jukebox</title>
    
    <!-- Forbindelse til vores CSS-ark (styles.css), som bestemmer hvordan det ser ud -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ==========================================
      TOPBAR (Oprettet af Ulas og Bashar)
      HVORFOR VALGT?: Vi har valgt at lave en topbar, fordi den 
      giver brugeren et fast overblik og hurtig adgang til navigationen.
    =========================================== -->
    <header class="topbar">
        
        <!-- Logo og navn i venstre side -->
        <div class="logo-container">
            <!-- Billedet af logoet. Vi bruger 'border-radius: 50%' i CSS til at fjerne den hvide baggrund -->
            <img src="image/nextlogo.jpg" alt="Next Track Logo" class="logo-img">
            <span class="logo-text">Next Track</span>
        </div>

        <!-- Navigation (Menupunkter) i højre side -->
        <nav class="navbar">
            <a href="#" class="active">Home</a>
            <a href="#queue">Queue</a>
            <a href="#admin">Admin</a>
        </nav>

    </header>


    <!-- ==========================================
      HOVEDINDHOLD (Main Content)
    =========================================== -->
    <main class="main-content">
        
        <h1>Choose your favorite genres</h1>
        <p>Click the button to select a genre for the vote:</p>

        <!-- Container der samler alle genre-kortene -->
        <div class="genre-container">
            
            <!-- GENRE 1: ROCK -->
            <div class="genre-card">
                <span>Rock</span>
                <!-- 
                  HVORFOR VALGT?: Vi bruger 'onclick'. Når brugeren klikker på knappen, 
                  kalder vi en JavaScript-funktion ('toggleGenre') og sender 'this' (knappen selv) 
                  og genrens navn ('Rock') med ind i koden.
                -->
                <button class="check-btn" onclick="toggleGenre(this, 'Rock')">✓</button>
            </div>

            <!-- GENRE 2: RAP -->
            <div class="genre-card">
                <span>Rap</span>
                <button class="check-btn" onclick="toggleGenre(this, 'Rap')">✓</button>
            </div>

            <!-- GENRE 3: POP -->
            <div class="genre-card">
                <span>Pop</span>
                <button class="check-btn" onclick="toggleGenre(this, 'Pop')">✓</button>
            </div>

        </div>

        <hr class="divider">

        <!-- ==========================================
          SØGEMASKINE
          HVORFOR VALGT?: Vi bruger 'onkeyup' på input-feltet. 
          Det betyder, at funktionen 'searchSongs()' kører automatisk, 
          hver gang brugeren slipper en tast på tastaturet (live-søgning).
        =========================================== -->
        <h2>Søg efter musik</h2>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchSongs()" placeholder="Søg efter kunstner eller sang...">
        </div>

        <!-- Her viser JavaScript resultaterne af søgningen -->
        <ul id="searchResultsDisplay" class="search-results"></ul>

        <hr class="divider">

        <!-- ==========================================
          TILFØJ SELV SANGE
          HVORFOR VALGT?: Giver brugeren mulighed for at skrive 
          en sangtitel og vælge hvilken af de 4 lister den skal i.
        =========================================== -->
        <h2>Tilføj musik til listerne</h2>
        <div class="add-song-box">
            <!-- Input-felt hvor brugeren skriver sangens navn -->
            <input type="text" id="songInput" placeholder="Skriv kunstner og sangtitel...">
            
            <!-- Dropdown-menu så brugeren kan vælge mellem de 4 lister -->
            <select id="listSelect">
                <option value="rock">Rock liste</option>
                <option value="rap">Rap liste</option>
                <option value="pop">Pop liste</option>
                <option value="custom">Egen liste (Brugerens valg)</option>
            </select>

            <!-- Knap der aktiverer funktionen 'addSong()' i JavaScript -->
            <button class="add-btn" onclick="addSong()">Tilføj sang</button>
        </div>

        <!-- ==========================================
          DE 4 MUSIKLISTER (Visning på skærmen)
          HVORFOR 'ul' og 'id'?: En <ul> er en punktliste i HTML. 
          Vi giver hver liste et unikt 'id', så JavaScript ved præcis, 
          hvilken boks sangen skal vises i.
        =========================================== -->
        <div class="playlists-grid">
            
            <div class="playlist-box">
                <h3>🎸 Rock</h3>
                <ul id="rockListDisplay"></ul>
            </div>

         <div class="playlist-box">
                <h3>🎤 Rap</h3>
                <ul id="rapListDisplay"></ul>
            </div>

            <div class="playlist-box">
                <h3>🎧 Pop</h3>
                <ul id="popListDisplay"></ul>
            </div>

            <div class="playlist-box">
                <h3>⭐ Egen Liste</h3>
                <ul id="customListDisplay"></ul>
            </div>

        </div>

    </main>

    <script src="./scripts.js"></script>

</body>
</html>
